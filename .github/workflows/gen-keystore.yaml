name: 生成签名密钥（一次性）

# 只用于生成一次固定的 release 签名密钥，
# 生成后把 keystore 和 key.properties 下载下来存进 GitHub Secrets，
# 之后所有构建都用同一签名，覆盖安装不再冲突。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genkey:
    runs-on: ubuntu-latest
    steps:
      - name: 生成 keystore
        run: |
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/bobomusic-keystore.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 36500 \
            -alias bobomusic \
            -storepass bobomusic2024 \
            -keypass bobomusic2024 \
            -dname "CN=Manman Music, OU=Manman, O=Manman, L=Shanghai, ST=Shanghai, C=CN"

      - name: 生成 key.properties
        run: |
          cat > out/key.properties <<'EOF'
          storePassword=bobomusic2024
          keyPassword=bobomusic2024
          keyAlias=bobomusic
          storeFile=bobomusic-keystore.jks
          EOF

      - name: 打包
        run: |
          cd out
          base64 -w 0 bobomusic-keystore.jks > keystore.b64.txt
          ls -lh

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: out/
          retention-days: 3
