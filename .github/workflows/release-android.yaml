name: 构建 Android 应用

on:
  push:
    tags:
      - 'v*'
  # 支持在 Actions 页面手动点按钮构建，打完包直接下载
  workflow_dispatch:

# 创建 Release 需要写权限（默认 token 是只读的）
permissions:
  contents: write

jobs:
  main:
    name: Release Android App
    runs-on: ubuntu-latest
    steps:
      - name: 克隆仓库
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.1
          channel: stable
          cache: true

      - name: 安装依赖
        # 与 pubspec.lock 里记录的源保持一致，避免依赖版本漂移
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        run: flutter pub get

      - name: 运行静态检查
        # info 级提示（如依赖版本差异带来的 deprecated 提醒）不算失败
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 运行单元测试
        run: flutter test

      # 有签名密钥就用正式签名；没有就生成一个 debug 密钥，
      # build.gradle 里做了自动降级，保证任何环境都能出可安装的包
      - name: 准备签名文件
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "使用正式签名"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./android/app/bobomusic-keystore.jks
            printf '%s\n' "${{ secrets.KEY_PROPERTIES }}" > ./android/key.properties
            ls -lh ./android/app/bobomusic-keystore.jks
          else
            echo "未配置签名密钥，使用 debug 签名"
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 构建 APK
        run: flutter build apk --release

      - name: 整理产物
        run: |
          mkdir -p out
          # 优先只要 universal 包（手机上直接装，兼容所有 CPU）
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk out/满满音乐-通用版.apk
          elif [ -f build/app/outputs/flutter-apk/app-universal-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-universal-release.apk out/满满音乐-通用版.apk
          fi
          # 其余分架构包一并保留
          find build/app/outputs/flutter-apk -name "*-release.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: manman-music-apk
          path: out/*.apk
          retention-days: 30

      - name: 推送到 release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
